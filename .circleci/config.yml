version: 2.1

jobs:
  test:
    parameters:
      node_index:
        type: integer
        default: 0
    docker:
      - image: mcr.microsoft.com/playwright:v1.58.2-jammy
    working_directory: ~/project
    environment:
      CI: true
      TEST_ENV: qa
      CIRCLE_NODE_INDEX: << parameters.node_index >>
      CIRCLE_NODE_TOTAL: 4
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps

      - run:
          name: Run Playwright tests
          command: npx playwright test --shard=$((CIRCLE_NODE_INDEX+1))/${CIRCLE_NODE_TOTAL}

      - store_test_results:
          path: ~/project/test-results

      - run:
          name: Name artifacts by node for parallel upload
          command: |
            mv playwright-report playwright-report-${CIRCLE_NODE_INDEX} 2>/dev/null || true
            mv test-results test-results-${CIRCLE_NODE_INDEX} 2>/dev/null || true

      - store_artifacts:
          when: always
          path: ~/project/playwright-report-<< parameters.node_index >>
          destination: playwright-report-<< parameters.node_index >>

      - store_artifacts:
          when: always
          path: ~/project/test-results-<< parameters.node_index >>
          destination: test-results-<< parameters.node_index >>

workflows:
  test-on-push-and-pr:
    jobs:
      - test:
          matrix:
            parameters:
              node_index: [0, 1, 2, 3]
