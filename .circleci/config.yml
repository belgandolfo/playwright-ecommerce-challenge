version: 2.1

jobs:
  test:
    parallelism: 4
    docker:
      - image: mcr.microsoft.com/playwright:v1.58.2-jammy
    working_directory: ~/project
    environment:
      CI: true
      TEST_ENV: qa
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps

      - run:
          name: Run Playwright tests
          command: npx playwright test --shard=$((CIRCLE_NODE_INDEX+1))/${CIRCLE_NODE_TOTAL}

      - store_test_results:
          path: ~/project/test-results

      - run:
          name: Name artifacts by node for parallel upload
          command: |
            mv playwright-report playwright-report-${CIRCLE_NODE_INDEX} 2>/dev/null || true
            mv test-results test-results-${CIRCLE_NODE_INDEX} 2>/dev/null || true

      # The eight repeated store_artifacts blocks are needed because CircleCI doesnt support 
      # dynamic paths/destinations (e.g. from env vars) in the config.
      - store_artifacts:
          when: always
          path: ~/project/playwright-report-0
          destination: playwright-report-0
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/playwright-report-1
          destination: playwright-report-1
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/playwright-report-2
          destination: playwright-report-2
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/playwright-report-3
          destination: playwright-report-3
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/test-results-0
          destination: test-results-0
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/test-results-1
          destination: test-results-1
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/test-results-2
          destination: test-results-2
          continue_on_fail: true
      - store_artifacts:
          when: always
          path: ~/project/test-results-3
          destination: test-results-3
          continue_on_fail: true

workflows:
  test-on-push-and-pr:
    jobs:
      - test
